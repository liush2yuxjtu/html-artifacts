<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatCut v3 原版 vs 改版</title>
<style>
:root{--bg:#f4f1ec;--surface:#fff;--ink:#211a13;--muted:#7b736a;--line:#e3ddd4;--accent:#e2682e;--ok:#2f7a4f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,"PingFang SC","Noto Sans SC",sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
h1{font-size:15px;margin:0;font-weight:650}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.group>span{color:var(--muted);font-size:12px}
button{font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px 16px;min-height:0}
section{display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px}
.bar b{font-size:13px}
.bar small{color:var(--muted)}
.bar a{color:var(--accent)}
.stage{position:relative;flex:1;overflow:hidden;background:#fafafa}
.stage iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
.note{padding:6px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
@media (max-width:820px){main{grid-template-columns:1fr;grid-auto-rows:70vh}}
</style>
</head>
<body>
<header>
  <h1>ChatCut v3 · 原版 vs 改版</h1>
  <div class="group" role="group" aria-label="跳到区块">
    <span>跳到</span>
    <button type="button" id="jump-top" data-jump="">顶部</button>
    <button type="button" id="jump-b01" data-jump="editor-demo">B01 编辑器</button>
    <button type="button" id="jump-b02" data-jump="connect">B02 Agent</button>
  </div>
  <div class="group" role="group" aria-label="视口">
    <span>视口</span>
    <button type="button" id="vp-desktop" data-vp="1440" aria-pressed="true">桌面 1440</button>
    <button type="button" id="vp-mobile" data-vp="390" aria-pressed="false">手机 390</button>
  </div>
  <div class="group" role="group" aria-label="原版来源">
    <span>原版</span>
    <button type="button" id="src-frozen" data-src="frozen" aria-pressed="true">冻结基线</button>
    <button type="button" id="src-live" data-src="live" aria-pressed="false">线上实时</button>
  </div>
  <div class="group">
    <button type="button" id="reload">重新加载两侧</button>
  </div>
</header>
<main>
  <section aria-label="原版">
    <div class="bar"><b>原版</b><small id="orig-meta">chatcut.io 实验 B 冻结快照</small><a id="orig-open" href="baseline.html" target="_blank" rel="noopener">单独打开</a></div>
    <div class="stage" id="stage-orig"><iframe id="frame-orig" title="原版 ChatCut 首页" src="baseline.html"></iframe></div>
    <div class="note" id="orig-note">冻结基线：与改版同一份代码，只差 patch 层。</div>
  </section>
  <section aria-label="改版">
    <div class="bar"><b>改版</b><small id="play-meta">v3 可玩层（停住 → 点 Send → 原结果）</small><a href="index.html" target="_blank" rel="noopener">单独打开</a></div>
    <div class="stage" id="stage-play"><iframe id="frame-play" title="改版 ChatCut 可玩首页" src="index.html"></iframe></div>
    <div class="note">点编辑器或 Agent 面板里的 Send 体验改动。</div>
  </section>
</main>
<script>
(() => {
  const frames = { orig: document.getElementById('frame-orig'), play: document.getElementById('frame-play') };
  const stages = { orig: document.getElementById('stage-orig'), play: document.getElementById('stage-play') };
  const state = { vp: 1440, src: 'frozen', jump: '' };
  const LIVE = 'https://chatcut.io/';

  function fit() {
    for (const key of ['orig', 'play']) {
      const stage = stages[key], frame = frames[key];
      const scale = Math.min(1, stage.clientWidth / state.vp);
      frame.style.width = state.vp + 'px';
      frame.style.height = Math.ceil(stage.clientHeight / scale) + 'px';
      frame.style.transform = `scale(${scale})`;
      frame.style.left = Math.max(0, (stage.clientWidth - state.vp * scale) / 2) + 'px';
    }
  }

  // Same-origin frames scroll in place; the live chatcut.io frame is
  // cross-origin, so it is re-pointed at the anchor instead.
  function jump(id) {
    state.jump = id;
    for (const key of ['orig', 'play']) {
      const frame = frames[key];
      if (key === 'orig' && state.src === 'live') { frame.src = LIVE + (id ? '#' + id : ''); continue; }
      try {
        const doc = frame.contentDocument;
        const el = id && doc.getElementById(id);
        if (el) el.scrollIntoView({ block: 'start' }); else frame.contentWindow.scrollTo(0, 0);
      } catch (e) { /* not loaded yet */ }
    }
    press('[data-jump]', b => b.dataset.jump === id);
  }

  function press(sel, on) { document.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', String(on(b)))); }

  function readMeta() {
    try {
      const meta = frames.orig.contentDocument.querySelector('meta[name="cc-v3-baseline"]');
      if (meta && state.src === 'frozen') document.getElementById('orig-meta').textContent = meta.content;
    } catch (e) {}
  }

  function setSource(src) {
    state.src = src;
    press('[data-src]', b => b.dataset.src === src);
    const live = src === 'live';
    frames.orig.src = live ? LIVE : 'baseline.html';
    document.getElementById('orig-open').href = live ? LIVE : 'baseline.html';
    document.getElementById('orig-meta').textContent = live ? 'chatcut.io 线上实时（随机分到实验 A 或 B）' : 'chatcut.io 实验 B 冻结快照';
    document.getElementById('orig-note').textContent = live
      ? '线上实时：每次加载随机 A/B，会运行 chatcut.io 自己的统计脚本；若分到旧版 A，区块与改版不对应。'
      : '冻结基线：与改版同一份代码，只差 patch 层。';
  }

  frames.orig.addEventListener('load', () => { readMeta(); if (state.jump && state.src === 'frozen') setTimeout(() => jump(state.jump), 600); });
  frames.play.addEventListener('load', () => { if (state.jump) setTimeout(() => jump(state.jump), 600); });
  document.querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', () => jump(b.dataset.jump)));
  document.querySelectorAll('[data-vp]').forEach(b => b.addEventListener('click', () => { state.vp = Number(b.dataset.vp); press('[data-vp]', x => x === b); fit(); }));
  document.querySelectorAll('[data-src]').forEach(b => b.addEventListener('click', () => setSource(b.dataset.src)));
  document.getElementById('reload').addEventListener('click', () => {
    for (const f of Object.values(frames)) { try { f.contentWindow.location.reload(); } catch (e) { f.src = f.src; } }
  });
  new ResizeObserver(fit).observe(document.querySelector('main'));
  fit();
})();
</script>
</body>
</html>

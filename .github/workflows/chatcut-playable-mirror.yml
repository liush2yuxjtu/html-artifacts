name: Build ChatCut playable mirror

on:
  push:
    branches: [main]
    paths:
      - 'chatcut-mirror-src/**'
      - '.github/workflows/chatcut-playable-mirror.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatcut-playable-mirror
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Capture a consistent production snapshot
        run: node chatcut-mirror-src/stable-build.mjs
      - name: Guard each Astro island until hydration
        run: node chatcut-mirror-src/island-safe.mjs
      - name: Delay playable mutations until hydration
        run: node chatcut-mirror-src/hydration-safe.mjs
      - name: Apply local interaction hit-test fix
        run: node chatcut-mirror-src/postbuild-fix.mjs
      - name: Apply snapshot-driven visual polish
        run: node chatcut-mirror-src/visual-fix.mjs
      - name: Make the playable portable (public media hosts, current transcript guard)
        run: node chatcut-mirror-src/normalize-playable.mjs
      - name: Verify generated homepage contract
        run: |
          test -s chatcut-playable/index.html
          grep -q 'Your AI Video Editor' chatcut-playable/index.html
          grep -q 'data-cc-playable-patch' chatcut-playable/index.html
          grep -q 'data-cc-playable-island-safe' chatcut-playable/index.html
          grep -q 'data-cc-playable-layer-fix' chatcut-playable/index.html
          grep -q 'data-cc-playable-visual-fix' chatcut-playable/index.html
          grep -q 'data-cc-playable-hydration-safe' chatcut-playable/index.html
          grep -q 'name="cc-runtime-localized"' chatcut-playable/index.html
          test -n "$(find chatcut-playable/_astro -type f -name '*.js' -print -quit)"
          test -n "$(find chatcut-playable/_astro -type f -name '*.css' -print -quit)"
          ! grep -q 'https://chatcut.io/_astro/' chatcut-playable/index.html
          grep -q 'ccPlayableVersion' chatcut-playable/index.html
          grep -q 'best-moments' chatcut-playable/index.html
          grep -q 'transcript-captions' chatcut-playable/index.html
          grep -q 'image-to-video' chatcut-playable/index.html
          grep -q 'music-generation' chatcut-playable/index.html
          ! grep -rq '/_media/' chatcut-playable --include=*.html --include=*.js --include=*.css
          ! grep -rq 'ccPlayableVersion==="[0-9]*"' chatcut-playable/_astro
      - name: Install browser QA dependency
        run: npm install --prefix /tmp/chatcut-qa --no-save playwright@1.55.0 sharp@0.34.3
      - name: Install Chromium for QA
        run: /tmp/chatcut-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify localized runtime and native controls
        env:
          NODE_PATH: /tmp/chatcut-qa/node_modules
        run: node chatcut-mirror-src/runtime-qa.cjs
      - name: Compare full-page hydration journey with production
        env:
          NODE_PATH: /tmp/chatcut-qa/node_modules
        run: node chatcut-mirror-src/journey-qa.cjs
      - name: Run playable interaction QA and capture snapshots
        env:
          NODE_PATH: /tmp/chatcut-qa/node_modules
        run: node chatcut-mirror-src/qa.cjs
      - name: Render visual contact sheet PDF and mosaic
        env:
          NODE_PATH: /tmp/chatcut-qa/node_modules
        run: node chatcut-mirror-src/contact-sheet.cjs
      - name: Verify visual snapshots exist
        run: |
          test -s chatcut-snapshots/01-hero.png
          test -s chatcut-snapshots/02-expert-before.png
          test -s chatcut-snapshots/03-expert-after.png
          test -s chatcut-snapshots/06-transcript-before.png
          test -s chatcut-snapshots/07-transcript-after.png
          test -s chatcut-snapshots/09-image-before.png
          test -s chatcut-snapshots/10-image-after.png
          test -s chatcut-snapshots/11-video-before.png
          test -s chatcut-snapshots/12-video-after.png
          test -s chatcut-snapshots/13-music-before.png
          test -s chatcut-snapshots/14-music-after.png
          test -s chatcut-snapshots/contact-sheet.html
          test -s chatcut-snapshots/contact-sheet.pdf
          test -s chatcut-snapshots/contact-sheet.jpg
          grep -q '^SIZE 128 ' chatcut-snapshots/contact-sheet-visual.txt
      - name: Commit generated playable site and snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f chatcut-playable chatcut-snapshots
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Publish ChatCut playable mirror and visual snapshots [skip ci]'
          git push origin HEAD:main

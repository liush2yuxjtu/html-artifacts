name: Publish HTML Artifacts to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'business-world-agent-design-system/**'
      - 'live-project-registry/**'
      - 'ai-product-resume/**'
      - 'resume-gallery/**'
      - 'blacklake-agent-pm-resume/**'
      - 'chatcut-interaction-review/**'
      - 'chatcut-interaction-review-a06-v2/**'
      - 'chatcut-latest/**'
      - 'chatcut-playable/**'
      - 'chatcut-snapshots/**'
      - 'original-homepages-2026-09-15/**'
      - 'chatcut-production-mirror/**'
      - 'chatcut-product-thesis-v2/**'
      - 'telemetry-observatory-v2/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: html-artifacts-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build public Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R business-world-agent-design-system _site/
          if [ -d live-project-registry ]; then
            cp -R live-project-registry _site/
          fi
          if [ -d ai-product-resume ]; then
            mkdir -p _site/ai-product-resume
            cp ai-product-resume/index.html _site/ai-product-resume/
          fi
          if [ -d resume-gallery ]; then
            cp -R resume-gallery _site/
          fi
          if [ -d blacklake-agent-pm-resume ]; then
            cp -R blacklake-agent-pm-resume _site/
          fi
          if [ -d chatcut-interaction-review ]; then
            cp -R chatcut-interaction-review _site/
            # Keep the exact URLs used by the durable review, in addition to
            # the legacy chatcut-baseline/chatcut-preview aliases below.
            mkdir -p _site/original-homepages-2026-09-15
            cp -R original-homepages-2026-09-15/chatcut _site/original-homepages-2026-09-15/
            mkdir -p _site/chatcut-production-mirror
            cp -R chatcut-production-mirror/intent-assets _site/chatcut-production-mirror/
            test -s _site/original-homepages-2026-09-15/chatcut/index.html
            test -s _site/original-homepages-2026-09-15/chatcut/design-system.css
            test -s _site/chatcut-production-mirror/intent-assets/11-video-before.png
          fi
          if [ -d chatcut-interaction-review-a06-v2 ]; then
            cp -R chatcut-interaction-review-a06-v2 _site/
          fi
          if [ -d chatcut-latest ]; then
            cp -R chatcut-latest _site/
          fi
          if [ -d chatcut-playable ]; then
            cp -R chatcut-playable _site/
          fi
          if [ -d chatcut-snapshots ]; then
            cp -R chatcut-snapshots _site/
          fi
          if [ -d chatcut-product-thesis-v2 ]; then
            cp -R chatcut-product-thesis-v2 _site/
          fi
          if [ -d telemetry-observatory-v2 ]; then
            cp -R telemetry-observatory-v2 _site/
          fi
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>HTML Artifacts</title>
            <style>
              body{font-family:Inter,system-ui,sans-serif;margin:40px;background:#f6f7fb;color:#111827}
              main{max-width:760px;margin:auto}
              a{display:block;padding:16px 18px;margin:12px 0;background:white;border:1px solid #e5e7eb;border-radius:12px;color:#2563eb;text-decoration:none;font-weight:700}
            </style>
          </head>
          <body><main>
            <h1>HTML Artifacts</h1>
            <a href="./resume-gallery/">刘师宇 · Current Resume Gallery</a>
            <a href="./blacklake-agent-pm-resume/">Black Lake · Agent 产品经理代码版</a>
            <a href="./business-world-agent-design-system/">Business World Agent Design System</a>
            <a href="./live-project-registry/">Live Project Registry</a>
            <a href="./ai-product-resume/">刘师宇 · AI 产品简历</a>
            <a href="./chatcut-interaction-review/">ChatCut · 首页 Demo 交互评审</a>
            <a href="./chatcut-interaction-review-a06-v2/">ChatCut · A06 单 Reference 评审</a>
            <a href="./chatcut-latest/">ChatCut · Latest Playable Homepage</a>
            <a href="./chatcut-product-thesis-v2/">ChatCut · 产品与商业化思考（多页版）</a>
            <a href="./telemetry-observatory-v2/">Telemetry · 安装来源与转化看板</a>
          </main></body>
          </html>
          HTML

      - name: Install browser renderer
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0 pillow pypdf
          python -m playwright install --with-deps chromium

      - name: Build current ChatCut preview and capture Baseline vs Preview keyframes
        shell: bash
        run: |
          set -euo pipefail
          cd chatcut-production-mirror
          npm run build
          cd ..
          python chatcut-interaction-review/capture.py
          mkdir -p _site/chatcut-interaction-review/keyframes
          cp -R chatcut-interaction-review/keyframes/. _site/chatcut-interaction-review/keyframes/
          mkdir -p _site/chatcut-baseline
          cp -R original-homepages-2026-09-15/chatcut/. _site/chatcut-baseline/
          mkdir -p _site/chatcut-preview
          cp -R chatcut-production-mirror/dist/. _site/chatcut-preview/

      - name: Render and test AI product resume
        shell: bash
        run: |
          python ai-product-resume/render.py build \
            --source ai-product-resume/index.html \
            --out _site/ai-product-resume

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed AI product resume
        shell: bash
        env:
          RESUME_URL: ${{ steps.deployment.outputs.page_url }}ai-product-resume/
        run: |
          mkdir -p verification
          python ai-product-resume/render.py verify \
            --url "$RESUME_URL" \
            --out verification

      - name: Verify deployed Black Lake resume
        shell: bash
        env:
          BLACKLAKE_URL: ${{ steps.deployment.outputs.page_url }}blacklake-agent-pm-resume/
        run: |
          mkdir -p verification/blacklake
          python - <<'PY'
          import json, os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          url = os.environ["BLACKLAKE_URL"]
          out = Path("verification/blacklake")
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1240, "height": 1754})
              page.goto(url, wait_until="networkidle")
              text = page.locator("body").inner_text()
              for anchor in ["6 周", "2 个大区试点", "8,028+", "3,410+", "12 个工作流"]:
                  assert anchor in text, anchor
              link_count = page.locator("a[href^='https://']").count()
              assert link_count >= 8
              page.screenshot(path=str(out / "desktop.png"), full_page=True)
              page.emulate_media(media="screen")
              page.pdf(
                  path=str(out / "resume.pdf"),
                  width="210mm",
                  height="297mm",
                  scale=0.64,
                  print_background=True,
                  margin={"top":"0","right":"0","bottom":"0","left":"0"},
              )
              mobile = browser.new_page(viewport={"width": 390, "height": 844})
              mobile.goto(url, wait_until="networkidle")
              mobile_checks = mobile.evaluate("""() => ({
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                pageWidth: document.querySelector('.page').getBoundingClientRect().width,
                contentDisplay: getComputedStyle(document.querySelector('.content')).display,
                missionFontPx: parseFloat(getComputedStyle(document.querySelector('.mission')).fontSize)
              })""")
              assert mobile_checks["scrollWidth"] <= mobile_checks["clientWidth"], mobile_checks
              assert mobile_checks["pageWidth"] <= 391, mobile_checks
              assert mobile_checks["contentDisplay"] == "block", mobile_checks
              assert mobile_checks["missionFontPx"] >= 14, mobile_checks
              mobile.screenshot(path=str(out / "mobile.png"), full_page=True)
              browser.close()

          from PIL import Image, ImageChops, ImageOps, ImageStat
          from pypdf import PdfReader
          import math

          reference = Image.open("blacklake-agent-pm-resume/reference.webp").convert("RGB")
          current = Image.open(out / "desktop.png").convert("RGB").resize(reference.size, Image.Resampling.LANCZOS)
          raw = ImageChops.difference(reference, current)
          stat = ImageStat.Stat(raw)
          rmse = math.sqrt(sum(v * v for v in stat.rms) / len(stat.rms)) / 255.0
          gray = ImageOps.grayscale(raw)
          if gray.getextrema()[1] > gray.getextrema()[0]:
              gray = ImageOps.autocontrast(gray)
          ImageOps.colorize(gray, black=(255,255,255), white=(255,0,0)).save(out / "diff.png")
          assert rmse <= 0.35, f"pixel regression: normalized RMSE {rmse:.6f} > 0.35"
          reader = PdfReader(out / "resume.pdf")
          assert len(reader.pages) == 1
          p0 = reader.pages[0]
          width_pt = float(p0.mediabox.width)
          height_pt = float(p0.mediabox.height)
          assert abs(width_pt - 595.28) < 3 and abs(height_pt - 841.89) < 3, (width_pt, height_pt)
          pdf_urls = []
          for annot_ref in (p0.get("/Annots") or []):
              annot = annot_ref.get_object()
              action = annot.get("/A")
              if action and action.get("/URI"):
                  pdf_urls.append(str(action.get("/URI")))
          assert len(pdf_urls) >= 8, pdf_urls

          data = {
              "url": url,
              "desktop_links": link_count,
              "pdf_url_annotations": len(pdf_urls),
              "pdf_a4_points": [round(width_pt, 2), round(height_pt, 2)],
              "mobile_checks": mobile_checks,
              "anchors": ["6 周", "2 个大区试点", "8,028+", "3,410+", "12 个工作流"],
              "reference_size": list(reference.size),
              "normalized_rmse": round(rmse, 6),
              "rmse_threshold": 0.35,
              "status": "PASS"
          }
          print(json.dumps(data, ensure_ascii=False))
          (out / "verification.json").write_text(json.dumps(data, ensure_ascii=False, indent=2))

          PY

      - name: Upload webapp-testing snapshots
        uses: actions/upload-artifact@v4
        with:
          name: html-artifacts-webapp-testing
          path: verification

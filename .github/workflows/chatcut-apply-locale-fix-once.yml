name: ChatCut restore locale fallback one-shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chatcut-apply-locale-fix-once.yml

permissions:
  contents: write

jobs:
  restore-fix-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chatcut-final-acceptance
          fetch-depth: 0
      - name: Restore canonical locale fallback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Mac mini QA'
          git config user.email 'actions@users.noreply.github.com'
          git revert --no-edit d1e896a7eee83293eaa932e73ed90cfbe7ce2e66
          if [ -f .github/workflows/chatcut-fix-localized-home-once.yml ]; then
            git rm .github/workflows/chatcut-fix-localized-home-once.yml
            git commit -m 'chore(chatcut): remove one-shot locale workflow'
          fi
          node --test chatcut-mirror-src/tests/*.test.mjs chatcut-production-mirror/tests/*.test.mjs
          git push origin HEAD:fix/chatcut-final-acceptance

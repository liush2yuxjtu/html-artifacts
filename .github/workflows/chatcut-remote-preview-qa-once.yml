name: ChatCut protected preview browser acceptance (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatcut-remote-preview-qa-once.yml'

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: https://chatcut-production-mirror-preview-jmz3ykwjg.vercel.app
      SHARE_URL: https://chatcut-production-mirror-preview-jmz3ykwjg.vercel.app/?_vercel_share=xD1sL16ufNCK99m7EIY2M9yWeebDtBTa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --prefix /tmp/chatcut-remote-qa --no-save playwright@1.55.0
          /tmp/chatcut-remote-qa/node_modules/.bin/playwright install --with-deps chromium

      - name: Run protected Preview browser acceptance
        env:
          NODE_PATH: /tmp/chatcut-remote-qa/node_modules
        run: |
          mkdir -p remote-preview-evidence
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const { URL } = require('url');

          const target = process.env.TARGET_URL;
          const share = process.env.SHARE_URL;
          const targetHost = new URL(target).host;
          const out = 'remote-preview-evidence';
          const result = { target, steps: [], failures: [] };
          const consoleErrors = [];
          const pageErrors = [];
          const badResponses = [];

          const isVisible = async (loc) => {
            if (await loc.count() === 0) return false;
            return await loc.first().evaluate((el) => {
              const s = getComputedStyle(el);
              const r = el.getBoundingClientRect();
              return s.display !== 'none' && s.visibility !== 'hidden' && Number(s.opacity) !== 0 && r.width > 0 && r.height > 0;
            });
          };

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1100 },
              locale: 'zh-CN',
              timezoneId: 'Asia/Shanghai',
            });
            const page = await context.newPage();
            page.on('console', (m) => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('pageerror', (e) => pageErrors.push(String(e)));
            page.on('response', (r) => {
              if (r.status() >= 400) badResponses.push({ status: r.status(), url: r.url(), type: r.request().resourceType() });
            });

            let response = await page.goto(share, { waitUntil: 'networkidle', timeout: 90000 });
            result.steps.push({ name: 'vercel_preflight', status: response?.status(), url: page.url(), title: await page.title() });
            await page.screenshot({ path: `${out}/01-preflight.png` });
            if (!response || response.status() >= 400) result.failures.push(`preflight status ${response?.status()}`);

            response = await page.goto(`${target}/zh`, { waitUntil: 'networkidle', timeout: 90000 });
            const h1 = await page.locator('h1').first().innerText().catch(() => null);
            const body = await page.locator('body').innerText();
            result.steps.push({ name: 'localized_product', status: response?.status(), url: page.url(), title: await page.title(), h1 });
            await page.screenshot({ path: `${out}/02-zh-product.png` });
            if (!response || response.status() >= 400) result.failures.push(`/zh status ${response?.status()}`);
            if (!body.includes('说出想法') || !body.includes('剪出你想要的视频')) result.failures.push('localized hero copy missing');
            if (body.includes("This page doesn’t exist") || (await page.title()).includes('404: NOT_FOUND')) result.failures.push('/zh rendered Vercel 404');

            // Hero Agent reveal and host switch.
            const agentBtn = page.locator('[data-agent-open]').first();
            if (await agentBtn.count() === 0) {
              result.failures.push('agent reveal button missing');
            } else {
              const before = await agentBtn.getAttribute('aria-expanded');
              await agentBtn.click();
              await page.waitForTimeout(450);
              const after = await agentBtn.getAttribute('aria-expanded');
              const panel = page.locator('#agent-install');
              const panelVisible = await isVisible(panel);
              result.steps.push({ name: 'agent_reveal', aria_before: before, aria_after: after, panel_visible: panelVisible });
              await page.screenshot({ path: `${out}/03-agent-reveal.png` });
              if (after !== 'true' || !panelVisible) result.failures.push('agent reveal did not open');

              const claude = page.locator('#agent-pick-claude');
              if (await claude.count()) {
                await claude.check();
                await page.waitForTimeout(200);
                const checked = await claude.isChecked();
                result.steps.push({ name: 'agent_switch_claude', checked });
                if (!checked) result.failures.push('Claude agent switch failed');
              } else result.failures.push('Claude agent control missing');
            }

            // Playable demo state transition.
            const best = page.locator('#best-moments');
            await best.scrollIntoViewIfNeeded();
            await page.waitForTimeout(400);
            const localSend = best.locator('.cc-local-send');
            if (await localSend.count()) {
              await localSend.click();
              await page.waitForTimeout(500);
              const running = await best.evaluate(el => el.classList.contains('cc-expert-running'));
              const session = await page.evaluate(() => window.__chatcutDemoSession || null);
              result.steps.push({ name: 'best_moments_demo', running, session });
              await page.screenshot({ path: `${out}/04-best-moments-running.png` });
              if (!running || session?.expert !== 'running') result.failures.push('best moments demo state transition failed');
            } else {
              result.failures.push('best moments local send missing');
            }

            // Transcript demo state transition.
            const transcript = page.locator('#transcript-captions [data-tc-part="edit"]');
            await transcript.scrollIntoViewIfNeeded();
            await page.waitForTimeout(300);
            const transcriptSend = page.locator('#tc-edit-send');
            if (await transcriptSend.count()) {
              await transcriptSend.click();
              await page.waitForTimeout(1400);
              const collapsed = await transcript.locator('.tc-word.tc-collapsed').count();
              const status = await page.locator('#tc-edit-status').innerText().catch(() => null);
              const session = await page.evaluate(() => window.__chatcutDemoSession || null);
              result.steps.push({ name: 'transcript_demo', collapsed_fillers: collapsed, status, session });
              await page.screenshot({ path: `${out}/05-transcript-clean.png` });
              if (collapsed < 1 || session?.transcript !== 'clean') result.failures.push('transcript demo state transition failed');
            } else result.failures.push('transcript send control missing');

            // Pricing toggle.
            const pricing = page.locator('#pricing');
            await pricing.scrollIntoViewIfNeeded();
            await page.waitForTimeout(250);
            const monthly = page.locator('[data-pricing-billing="monthly"]');
            const annual = page.locator('[data-pricing-billing="annual"]');
            const firstPrice = page.locator('[data-plan-card]').first().locator('[data-pricing-price]');
            const beforePrice = await firstPrice.innerText();
            await annual.click();
            await page.waitForTimeout(250);
            const afterPrice = await firstPrice.innerText();
            const annualPressed = await annual.getAttribute('aria-pressed');
            const monthlyPressed = await monthly.getAttribute('aria-pressed');
            result.steps.push({ name: 'pricing_toggle', before_price: beforePrice, after_price: afterPrice, annual_pressed: annualPressed, monthly_pressed: monthlyPressed });
            await page.screenshot({ path: `${out}/06-pricing-annual.png` });
            if (annualPressed !== 'true' || monthlyPressed !== 'false' || afterPrice === beforePrice) result.failures.push('pricing annual toggle failed');

            // FAQ accordion.
            const faq = page.getByRole('button', { name: 'ChatCut 是什么？' }).first();
            await faq.scrollIntoViewIfNeeded();
            await faq.click();
            await page.waitForTimeout(250);
            const expanded = await faq.getAttribute('aria-expanded');
            result.steps.push({ name: 'faq_expand', aria_expanded: expanded });
            await page.screenshot({ path: `${out}/07-faq-expanded.png` });
            if (expanded !== 'true') result.failures.push('FAQ did not expand');

            // Walk the whole page so lazy local assets load.
            const height = await page.evaluate(() => document.documentElement.scrollHeight);
            for (let y = 0; y < height; y += 850) {
              await page.evaluate(y => scrollTo(0, y), y);
              await page.waitForTimeout(100);
            }
            await page.evaluate(() => scrollTo(0, 0));
            await page.waitForTimeout(400);

            const brokenLocalImages = await page.evaluate((host) => Array.from(document.images)
              .filter(i => {
                try { return new URL(i.currentSrc || i.src).host === host && i.complete && i.naturalWidth === 0; }
                catch { return false; }
              })
              .map(i => i.currentSrc || i.src), targetHost);
            result.assets = { broken_local_images: brokenLocalImages };
            if (brokenLocalImages.length) result.failures.push(`${brokenLocalImages.length} local images failed`);

            const targetErrors = badResponses.filter(x => {
              try { return new URL(x.url).host === targetHost; } catch { return false; }
            });
            const externalErrors = badResponses.filter(x => {
              try { return new URL(x.url).host !== targetHost; } catch { return true; }
            });
            result.http_errors = { target: targetErrors, external: externalErrors.slice(0, 30) };
            if (targetErrors.length) result.failures.push(`${targetErrors.length} target-origin 4xx/5xx responses`);

            const criticalConsole = consoleErrors.filter(t =>
              t.includes(targetHost) || /Uncaught|TypeError|ReferenceError|Error hydrating/i.test(t)
            );
            result.console_errors = { critical: criticalConsole, other: consoleErrors.filter(t => !criticalConsole.includes(t)).slice(0, 30) };
            result.page_errors = pageErrors;
            if (criticalConsole.length) result.failures.push(`${criticalConsole.length} critical console errors`);
            if (pageErrors.length) result.failures.push(`${pageErrors.length} page errors`);

            await page.screenshot({ path: `${out}/08-full-page.png`, fullPage: true });
            result.verdict = result.failures.length ? 'WEBAPP_TEST_FAIL' : 'WEBAPP_TEST_PASS';
            fs.writeFileSync(`${out}/report.json`, JSON.stringify(result, null, 2));
            console.log(JSON.stringify(result, null, 2));
            console.log(result.verdict);
            await browser.close();
            if (result.failures.length) process.exit(1);
          })().catch(async (err) => {
            console.error(err);
            result.failures.push(String(err));
            result.verdict = 'WEBAPP_TEST_FAIL';
            fs.writeFileSync(`${out}/report.json`, JSON.stringify(result, null, 2));
            process.exit(1);
          });
          NODE

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatcut-protected-preview-browser-evidence
          path: remote-preview-evidence/
          if-no-files-found: warn

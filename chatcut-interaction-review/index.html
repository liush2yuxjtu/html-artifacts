<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatCut Interaction Review</title>
<style>
:root{--bg:#f7f7f8;--card:#fff;--ink:#18181b;--muted:#71717a;--line:#e4e4e7;--accent:#4f46e5;--soft:#eef2ff;--dark:#111827}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}
main{max-width:1180px;margin:auto;padding:24px 18px 56px}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:18px}.top h1{font-size:26px;line-height:1.1;margin:0}.top p{margin:6px 0 0;color:var(--muted);max-width:760px}.pill{white-space:nowrap;font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;background:#18181b;color:white;padding:8px 10px;border-radius:9px}
.nav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:thin}.nav button{min-height:42px;padding:9px 12px;border:1px solid var(--line);background:white;border-radius:10px;white-space:nowrap;font-weight:700;color:#52525b}.nav button[aria-selected="true"]{border-color:#a5b4fc;background:var(--soft);color:#3730a3}
.review{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden}.head{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.head h2{font-size:18px;margin:0}.head .desc{color:var(--muted);margin-top:3px}.status{font-size:12px;font-weight:800;padding:6px 9px;border-radius:999px;background:#f4f4f5;color:#52525b}
.compare{display:grid;grid-template-columns:1fr 1fr;min-height:470px}.pane{min-width:0;padding:16px}.pane+.pane{border-left:1px solid var(--line)}.label{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;font-weight:800}.label small{font-weight:500;color:var(--muted)}
.baseline{aspect-ratio:16/10;border-radius:14px;background:#f1f5f9;border:1px solid #e2e8f0;overflow:hidden;display:grid;place-items:center;color:#64748b;text-align:center;padding:18px}.baseline img{width:100%;height:100%;object-fit:contain;display:block}.baseline .fallback{max-width:260px}
.live{background:#0b1020;border-radius:14px;padding:14px;color:#e5e7eb;min-height:294px;display:flex;flex-direction:column;gap:12px}.livebar{display:flex;justify-content:space-between;gap:10px;align-items:center}.livebar strong{font-size:13px}.livebar span{font-size:12px;color:#94a3b8}.stage{flex:1;background:#111827;border:1px solid #263041;border-radius:12px;padding:14px;overflow:hidden;display:flex;flex-direction:column;justify-content:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:44px;padding:10px 14px;border:0;border-radius:10px;background:#eef2ff;color:#3730a3;font-weight:800;cursor:pointer}.btn.secondary{background:#1f2937;color:#e5e7eb}.btn:disabled{opacity:.45}.btn:focus-visible,.nav button:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}
.film{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.film i{aspect-ratio:16/10;border-radius:6px;background:linear-gradient(135deg,#94a3b8,#334155)}.progress{height:7px;background:#1f2937;border-radius:999px;overflow:hidden;margin-top:14px}.progress i{display:block;height:100%;width:0;background:#a5b4fc;transition:width 1s ease}
.motion{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.motion i{height:58px;border-radius:8px;background:#1f2937;border:1px solid #374151;opacity:.42;transform:translateY(7px);transition:.55s ease}.motion.done i{opacity:1;transform:none;background:#312e81}.transcript{font-size:15px;line-height:1.9}.filler{display:inline-block;background:#7c2d12;color:#fed7aa;border-radius:5px;padding:0 4px;transition:.3s}.filler.gone{opacity:0;transform:scale(.7);width:0;padding:0;margin:0;overflow:hidden}.caption{height:170px;border-radius:12px;background:linear-gradient(135deg,#334155,#0f172a);display:grid;place-items:center;text-align:center;padding:18px}.caption b{font-size:23px;padding:7px 10px;border-radius:8px;background:rgba(0,0,0,.68);transition:.25s}.visual{height:180px;border-radius:12px;background:linear-gradient(135deg,#c4b5fd,#334155);display:grid;place-items:center;font-weight:800;transition:.5s}.visual.result{background:linear-gradient(135deg,#f59e0b,#7c3aed)}.visual.playing::after{content:'▶  Preview playing';position:absolute}.wave{height:100px;display:flex;align-items:center;gap:3px}.wave i{width:4px;height:12px;border-radius:999px;background:#64748b;transition:.4s}.wave.done i{background:#a5b4fc}.wave.done i:nth-child(2n){height:36px}.wave.done i:nth-child(3n){height:58px}.wave.done i:nth-child(5n){height:70px}
.evidence{border-top:1px solid var(--line);padding:14px 18px;background:#fafafa}.evidence summary{cursor:pointer;font-weight:800}.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.frame{border:1px solid var(--line);border-radius:10px;background:white;padding:8px}.frame .shot{aspect-ratio:16/9;background:#f1f5f9;border-radius:7px;overflow:hidden;display:grid;place-items:center;color:#94a3b8;font-size:12px}.frame img{width:100%;height:100%;object-fit:contain}.frame small{display:block;margin-top:6px;color:var(--muted)}
.feedback{margin-top:12px;color:var(--muted);font-size:13px}.feedback code{color:#3730a3;background:#eef2ff;padding:2px 5px;border-radius:5px}
@media(max-width:760px){main{padding:14px 10px 40px}.top{align-items:flex-start}.top h1{font-size:22px}.pill{display:none}.review{border-radius:14px}.head{align-items:flex-start}.compare{grid-template-columns:1fr;min-height:0}.pane{padding:12px}.pane+.pane{border-left:0;border-top:1px solid var(--line)}.baseline{aspect-ratio:16/9}.live{min-height:0}.actions .btn{flex:1 1 130px}.motion{grid-template-columns:repeat(2,1fr)}.frames{grid-template-columns:1fr}.nav{margin-inline:-2px}.status{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main>
<div class="top"><div><h1>ChatCut · Baseline vs Preview</h1><p>一次只审一个素材。左边看基础版本，右边直接点最新交互。手机上同样可用。</p></div><div class="pill" id="indexPill">A01</div></div>
<div class="nav" role="tablist" aria-label="Review elements" id="nav"></div>
<section class="review"><div class="head"><div><h2 id="title"></h2><div class="desc" id="desc"></div></div><span class="status" id="status">Review</span></div>
<div class="compare"><div class="pane"><div class="label">Baseline <small>2026-09-15</small></div><div class="baseline" id="baseline"></div></div><div class="pane"><div class="label">Interactive Preview <small>current concept</small></div><div class="live" id="live"></div><div class="feedback" id="feedback"></div></div></div>
<details class="evidence"><summary>关键帧证据（Baseline / Preview K0 / Preview K1）</summary><div class="frames" id="frames"></div></details></section>
</main><script>
(()=>{const data=[
{id:'A01',title:'Best Moments',desc:'用户点一次 Send，后续自动演完。',trigger:'Send',type:'expert'},
{id:'A02',title:'AI Motion Graphics',desc:'用户点一次 Generate，motion cards 自动 Reveal。',trigger:'Generate',type:'motion'},
{id:'A03',title:'Text-Based Editing',desc:'用户点一次 Clean，filler words 自动消失。',trigger:'Clean',type:'transcript'},
{id:'A04',title:'Auto AI Captions',desc:'用户点一个 Caption preset 后才开始预览。',trigger:'Preset',type:'captions'},
{id:'A05',title:'AI Image Generation',desc:'用户点一次 Generate，source → loading → result。',trigger:'Generate',type:'image'},
{id:'A06',title:'AI Video Generation',desc:'用户点一次 Generate，reference → loading → preview。',trigger:'Generate',type:'video'},
{id:'A07',title:'AI Music Generator',desc:'用户点一次 Send，silent source → waveform。',trigger:'Send',type:'music'}];
let current=0,timers=[];const $=s=>document.querySelector(s),nav=$('#nav'),live=$('#live');
function baselineUrl(id){return `https://liush2yuxjtu.github.io/html-artifacts/chatcut-interaction-review/keyframes/${id.toLowerCase()}-baseline.png`}
function keyUrl(id,k){return `https://liush2yuxjtu.github.io/html-artifacts/chatcut-interaction-review/keyframes/${id.toLowerCase()}-${k}.png`}
function clear(){timers.forEach(clearTimeout);timers=[]}
function stage(d){if(d.type==='expert')return `<div class="stage"><div class="film">${'<i></i>'.repeat(6)}</div><div class="progress"><i></i></div><div style="margin-top:12px;color:#94a3b8">Find the highlights and add B-roll.</div></div><div class="actions"><button class="btn" data-run>Send</button><button class="btn secondary" data-reset>Reset</button></div>`;
if(d.type==='motion')return `<div class="stage"><div class="motion">${'<i></i>'.repeat(6)}</div></div><div class="actions"><button class="btn" data-run>Generate</button><button class="btn secondary" data-reset>Reset</button></div>`;
if(d.type==='transcript')return `<div class="stage"><div class="transcript">Today <span class="filler">um</span> I want to <span class="filler">like</span> show how <span class="filler">you know</span> text editing works.</div></div><div class="actions"><button class="btn" data-run>Clean filler words</button><button class="btn secondary" data-reset>Reset</button></div>`;
if(d.type==='captions')return `<div class="stage"><div class="caption"><b>Readable captions, styled fast.</b></div></div><div class="actions"><button class="btn" data-preset="plain">Plain</button><button class="btn" data-preset="pop">TikTok Pop</button><button class="btn" data-preset="noir">Noir</button><button class="btn secondary" data-reset>Reset</button></div>`;
if(d.type==='image')return `<div class="stage"><div class="visual">Source image</div></div><div class="actions"><button class="btn" data-run>Generate</button><button class="btn secondary" data-reset>Reset</button></div>`;
if(d.type==='video')return `<div class="stage"><div class="visual">Reference frame</div></div><div class="actions"><button class="btn" data-run>Generate</button><button class="btn secondary" data-reset>Reset</button></div>`;
return `<div class="stage"><div style="color:#94a3b8;font-size:13px">Upbeat lo-fi hip hop · 90 BPM</div><div class="wave">${'<i></i>'.repeat(24)}</div></div><div class="actions"><button class="btn" data-run>Send</button><button class="btn secondary" data-reset>Reset</button></div>`}
function render(i){clear();current=i;const d=data[i];$('#indexPill').textContent=d.id;$('#title').textContent=`${d.id} · ${d.title}`;$('#desc').textContent=d.desc;$('#baseline').innerHTML=`<img src="${baselineUrl(d.id)}" alt="${d.id} baseline">`;live.innerHTML=`<div class="livebar"><strong>${d.title}</strong><span aria-live="polite">Idle · waiting for you</span></div>${stage(d)}`;$('#feedback').innerHTML=`评审反馈可直接写：<code>${d.id}：……</code>`;$('#frames').innerHTML=['baseline','preview-idle','preview-after'].map((k,j)=>`<div class="frame"><div class="shot"><img src="${keyUrl(d.id,k)}" alt="${d.id} ${k}" /></div><small>${['Baseline','Preview K0 · idle','Preview K1 · after trigger'][j]}</small></div>`).join('');[...nav.children].forEach((b,n)=>b.setAttribute('aria-selected',n===i?'true':'false'));}
function reset(){clear();render(current)}function run(){const d=data[current],st=live.querySelector('.livebar span');if(d.type==='expert'){st.textContent='Running…';live.querySelector('.progress i').style.width='100%';timers.push(setTimeout(()=>st.textContent='Done · first cut updated',1100))}else if(d.type==='motion'){st.textContent='Generating…';timers.push(setTimeout(()=>{live.querySelector('.motion').classList.add('done');st.textContent='Done · motion ready'},350))}else if(d.type==='transcript'){st.textContent='Cleaning…';live.querySelectorAll('.filler').forEach((x,n)=>timers.push(setTimeout(()=>x.classList.add('gone'),160+n*180)));timers.push(setTimeout(()=>st.textContent='Done · fillers removed',850))}else if(d.type==='image'||d.type==='video'){const v=live.querySelector('.visual');st.textContent='Generating…';v.textContent='Generating…';timers.push(setTimeout(()=>{v.classList.add('result');v.textContent=d.type==='image'?'Generated result':'Generated preview';st.textContent='Done'},850))}else if(d.type==='music'){st.textContent='Generating…';timers.push(setTimeout(()=>{live.querySelector('.wave').classList.add('done');st.textContent='Done · waveform ready'},750))}}
nav.innerHTML=data.map((d,i)=>`<button type="button" role="tab" data-i="${i}">${d.id}</button>`).join('');nav.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)render(+b.dataset.i)});live.addEventListener('click',e=>{if(e.target.closest('[data-reset]'))return reset();if(e.target.closest('[data-run]'))return run();const p=e.target.closest('[data-preset]');if(p){const b=live.querySelector('.caption b'),st=live.querySelector('.livebar span');if(p.dataset.preset==='plain'){b.style.background='rgba(0,0,0,.68)';b.style.color='#fff';b.style.transform='none'}if(p.dataset.preset==='pop'){b.style.background='#fff';b.style.color='#111827';b.style.transform='scale(1.06) rotate(-1deg)'}if(p.dataset.preset==='noir'){b.style.background='rgba(15,23,42,.9)';b.style.color='#e2e8f0';b.style.transform='scale(.98)'}st.textContent='Playing · '+p.textContent;clear();timers.push(setTimeout(()=>st.textContent='Done · caption previewed',800))}});render(0)})();
</script></body></html>

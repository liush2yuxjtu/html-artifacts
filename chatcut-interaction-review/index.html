<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatCut Real Baseline vs Preview</title>
<style>
:root{--bg:#f7f7f8;--card:#fff;--ink:#18181b;--muted:#71717a;--line:#e4e4e7;--accent:#4f46e5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}
main{max-width:1280px;margin:auto;padding:20px 16px 56px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end}.top h1{margin:0;font-size:26px}.top p{margin:6px 0 0;color:var(--muted)}.source{font:700 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:#18181b;color:#fff;padding:8px 10px;border-radius:9px}
.nav{display:flex;gap:8px;overflow-x:auto;padding:16px 0 12px}.nav button{min-width:52px;min-height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:800;color:#52525b}.nav button[aria-selected=true]{background:#eef2ff;color:#3730a3;border-color:#a5b4fc}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:15px 18px;border-bottom:1px solid var(--line)}.head h2{margin:0;font-size:18px}.head p{margin:4px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr}.pane{min-width:0;padding:14px}.pane+.pane{border-left:1px solid var(--line)}.label{display:flex;justify-content:space-between;margin-bottom:9px;font-weight:800}.label small{font-weight:500;color:var(--muted)}
.frame-wrap{border:1px solid #d4d4d8;border-radius:14px;overflow:hidden;background:#fff}.browserbar{height:34px;border-bottom:1px solid var(--line);background:#fafafa;display:flex;align-items:center;gap:6px;padding:0 10px}.dot{width:8px;height:8px;border-radius:50%;background:#d4d4d8}.url{margin-left:6px;color:#71717a;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
iframe{display:block;width:100%;height:560px;border:0;background:white}.notes{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}.notes code{background:#eef2ff;color:#3730a3;padding:2px 5px;border-radius:5px}.evidence{border-top:1px solid var(--line);padding:12px 16px;background:#fafafa}.evidence summary{font-weight:800;cursor:pointer}.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.shot{border:1px solid var(--line);border-radius:10px;background:white;padding:8px}.shot img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#f4f4f5;border-radius:7px}.shot small{display:block;margin-top:5px;color:var(--muted)}
@media(max-width:820px){main{padding:12px 8px 40px}.source{display:none}.grid{grid-template-columns:1fr}.pane+.pane{border-left:0;border-top:1px solid var(--line)}iframe{height:470px}.frames{grid-template-columns:1fr}.top h1{font-size:22px}.head{padding:13px}.pane{padding:10px}}
</style></head><body><main>
<div class="top"><div><h1>ChatCut · 真实 Baseline vs 最新 Preview</h1><p>左右两侧都是真实页面实例。左边是原始基线，右边是当前 main 构建；可直接点击、滚动、播放。</p></div><div class="source">baseline: 2026-09-15<br>preview: current main</div></div>
<div class="nav" id="nav" role="tablist"></div>
<section class="card"><div class="head"><div><h2 id="title"></h2><p id="desc"></p></div></div>
<div class="grid">
<div class="pane"><div class="label">Baseline <small>原始页面</small></div><div class="frame-wrap"><div class="browserbar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">/chatcut-baseline/</span></div><iframe id="base" src="../chatcut-baseline/" title="ChatCut baseline"></iframe></div></div>
<div class="pane"><div class="label">Preview <small>最新版真实交互</small></div><div class="frame-wrap"><div class="browserbar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">/chatcut-preview/</span></div><iframe id="preview" src="../chatcut-preview/" title="ChatCut preview"></iframe></div></div>
</div>
<div class="notes"><span id="instruction"></span><span>反馈格式：<code id="feedback"></code></span></div>
<details class="evidence"><summary>关键帧证据</summary><div class="frames" id="frames"></div></details>
</section></main>
<script>
(()=>{const items=[
{id:'A01',title:'Best Moments / Edit Like an Expert',desc:'Baseline 原样展示；Preview 点 Send 后自动演完。',baseText:'Edit Like an Expert Editor',preview:'#best-moments',trigger:'Send'},
{id:'A02',title:'AI Motion Graphics',desc:'Preview 点 Generate 后，原 motion graphics 自动展开。',baseText:'AI Motion Graphics, Generated From a Sentence',preview:'#motion-graphics',trigger:'Generate'},
{id:'A03',title:'Text-Based Editing',desc:'Preview 点 Clean/Send 后，filler words 自动清理。',baseText:'Text-Based Editing for Your Talking Head Content',preview:'#transcript-captions [data-tc-part="edit"]',trigger:'Clean / Send'},
{id:'A04',title:'Auto AI Captions',desc:'对比原始 captions 与最新版真实 captions 组件。',baseText:'Auto AI Captions, in 100+ Languages',preview:'#transcript-captions [data-tc-part="captions"]',trigger:'Preset / Preview'},
{id:'A05',title:'AI Image Generation',desc:'Preview 点 Generate 后，从 source 进入真实 result 状态。',baseText:'AI Image Generation, Right Inside Your Edit',preview:'#image-to-video .itv-story:not(.itv-story-video)',trigger:'Generate'},
{id:'A06',title:'AI Video Generation',desc:'Preview 点 Generate 后，reference 进入真实 video preview。',baseText:"AI Video Generation for the Shots You Couldn't Film",preview:'#image-to-video .itv-story-video',trigger:'Generate'},
{id:'A07',title:'AI Music Generator',desc:'Preview 点 Send 后，进入真实 waveform/music UI。',baseText:'AI Music Generator',preview:'#music-generation',trigger:'Send'}];
const nav=document.querySelector('#nav'),base=document.querySelector('#base'),preview=document.querySelector('#preview');
let current=0;
function scrollBaseline(text){try{const d=base.contentDocument;const hs=[...d.querySelectorAll('h1,h2,h3')];const h=hs.find(x=>x.textContent.includes(text));if(h)h.closest('section')?.scrollIntoView({block:'start'})}catch(e){}}
function scrollPreview(sel){try{const d=preview.contentDocument;const el=d.querySelector(sel);if(el)el.scrollIntoView({block:'start'})}catch(e){}}
function refreshScroll(){const it=items[current];setTimeout(()=>scrollBaseline(it.baseText),200);setTimeout(()=>scrollPreview(it.preview),300)}
function render(i){current=i;const it=items[i];document.querySelector('#title').textContent=`${it.id} · ${it.title}`;document.querySelector('#desc').textContent=it.desc;document.querySelector('#instruction').textContent=`右侧直接操作：${it.trigger}`;document.querySelector('#feedback').textContent=`${it.id}：……`;document.querySelector('#frames').innerHTML=['baseline','preview-idle','preview-after'].map((k,j)=>`<div class="shot"><img src="./keyframes/${it.id.toLowerCase()}-${k}.png" alt="${it.id} ${k}"><small>${['Baseline','Preview K0 · idle','Preview K1 · after trigger'][j]}</small></div>`).join('');[...nav.children].forEach((b,n)=>b.setAttribute('aria-selected',n===i?'true':'false'));refreshScroll()}
nav.innerHTML=items.map((x,i)=>`<button type="button" role="tab" data-i="${i}">${x.id}</button>`).join('');nav.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)render(+b.dataset.i)});base.addEventListener('load',refreshScroll);preview.addEventListener('load',refreshScroll);render(0)})();
</script></body></html>
